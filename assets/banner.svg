<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Credit Risk Scoring and Unsupervised Segmentation Pipeline</title>
  <desc id="desc">Architectural banner for statistical machine learning credit scoring and PCA K-Means borrower segmentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#1E293B" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="12" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="338" rx="11" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Technical Bar -->
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#1E293B" stroke-width="1"/>
  <text x="48" y="30" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">SYS.ID // CREDIT-RISK-ML-PIPELINE</text>
  <text x="1232" y="30" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1.5">DOMAIN // STATISTICAL MACHINE LEARNING &amp; RISK MODELING</text>

  <!-- Left Column: Title & Architecture -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">SCIKIT-LEARN // LEAK-FREE PIPELINE ARCHITECTURE</text>
    <text x="0" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">Credit Risk Scoring &amp; Segmentation</text>
    <text x="0" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8">End-to-end supervised default probability estimation, stratified hyperparameter optimization, and PCA/K-Means clustering.</text>

    <!-- Metric Specifications -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="175" height="64" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">TEST ROC-AUC (TUNED)</text>
      <text x="16" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" fill="#38BDF8">0.8092</text>

      <rect x="190" y="0" width="175" height="64" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="206" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">SVM PRECISION</text>
      <text x="206" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" fill="#10B981">72.55%</text>

      <rect x="380" y="0" width="175" height="64" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="396" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">CROSS-VALIDATION</text>
      <text x="396" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" fill="#818CF8">5-Fold Strat.</text>

      <rect x="570" y="0" width="175" height="64" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="586" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">UNSUPERVISED</text>
      <text x="586" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="800" fill="#F8FAFC">PCA + K-Means</text>
    </g>
  </g>

  <!-- Right Column: Pipeline Schematic -->
  <g transform="translate(850, 76)">
    <rect width="382" height="220" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">PIPELINE EXECUTION GRAPH</text>
    <line x1="20" y1="40" x2="362" y2="40" stroke="#1E293B" stroke-width="1"/>

    <rect x="20" y="54" width="342" height="32" rx="4" fill="#0B1120" stroke="#334155" stroke-width="1"/>
    <text x="32" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38BDF8">01</text>
    <text x="60" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">Stratified Train/Test Split (70/30)</text>

    <rect x="20" y="96" width="342" height="32" rx="4" fill="#0B1120" stroke="#334155" stroke-width="1"/>
    <text x="32" y="116" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38BDF8">02</text>
    <text x="60" y="116" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">ColumnTransformer (Scaler + OneHot)</text>

    <rect x="20" y="138" width="342" height="32" rx="4" fill="#0B1120" stroke="#334155" stroke-width="1"/>
    <text x="32" y="158" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#818CF8">03</text>
    <text x="60" y="158" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">LogReg / SVM / RF + GridSearchCV</text>

    <rect x="20" y="180" width="342" height="28" rx="4" fill="#0B1120" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="32" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#10B981">04</text>
    <text x="60" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">ROC-AUC Evaluation &amp; PCA Segmentation</text>
  </g>
</svg>
